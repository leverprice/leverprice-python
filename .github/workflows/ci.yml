name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEVERPRICE_REQUIRE_VECTORS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: false
      - run: uv pip install ruff mypy ".[crypto]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.crypto }} cryptography)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        crypto: [with, without]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false
      - run: uv pip install pytest .
      - if: matrix.crypto == 'with'
        run: uv pip install cryptography
      - name: Check the Python version and Ed25519 backend
        run: >-
          python -c "import sys; from leverprice import _crypto;
          print(sys.version, _crypto.backend());
          assert sys.version.startswith('${{ matrix.python }}.');
          assert _crypto.backend() == ('cryptography' if '${{ matrix.crypto }}' == 'with' else 'pure')"
      - run: python -m pytest

  frameworks:
    name: frameworks (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false
      - run: uv pip install pytest cryptography django flask starlette multidict .
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv build
      - run: uvx twine check --strict dist/*
